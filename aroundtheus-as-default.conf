server {
    listen 80 default_server;
    server_name 34.134.30.14 aroundtheus.bestbudwtwr.ignorelist.com;

    root /var/www;

    # Handle Around The U.S. project
    location = /aroundtheus/main.js {
        try_files $uri =404;
        add_header Content-Type "application/javascript";
    }

    location = /aroundtheus/main.css {
        try_files $uri =404;
        add_header Content-Type "text/css";
    }

    location ~ ^/aroundtheus/.+\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /aroundtheus/ {
        try_files $uri $uri/ /aroundtheus/index.html;
    }

    location = /aroundtheus {
        return 301 /aroundtheus/;
    }

    # Handle NewsExplorer for root and other paths
    location / {
        alias /var/www/news-explorer/dist/;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

