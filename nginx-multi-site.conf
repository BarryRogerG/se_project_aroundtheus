# Nginx configuration for running multiple projects on the same VM
# This allows both NewsExplorer and Around The U.S. to run simultaneously

# NewsExplorer - Main site (root path)
server {
    listen 80;
    server_name 34.134.30.14;

    root /var/www/news-explorer;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Around The U.S. - Subdirectory path
server {
    listen 80;
    server_name 34.134.30.14;

    root /var/www/aroundtheus;
    index index.html;

    location /aroundtheus {
        alias /var/www/aroundtheus;
        try_files $uri $uri/ /aroundtheus/index.html;
    }

    location /aroundtheus/ {
        alias /var/www/aroundtheus/;
        try_files $uri $uri/ /aroundtheus/index.html;
    }

    location ~* /aroundtheus/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        alias /var/www/aroundtheus;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

