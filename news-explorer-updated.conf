server {
    listen 80 default_server;
    server_name news-explorer.bestbudwtwr.ignorelist.com 34.134.30.14 _;        

    root /var/www/news-explorer/dist;
    index index.html;

    # Handle Around The U.S. project first (before the catch-all location /)
    location = /aroundtheus/main.js {
        alias /var/www/aroundtheus/main.js;
        default_type application/javascript;
        add_header Content-Type "application/javascript";
    }

    location = /aroundtheus/main.css {
        alias /var/www/aroundtheus/main.css;
        default_type text/css;
        add_header Content-Type "text/css";
    }

    location ~ ^/aroundtheus/.+\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        alias /var/www/aroundtheus;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /aroundtheus/ {
        alias /var/www/aroundtheus/;
        try_files $uri $uri/ /aroundtheus/index.html;
        index index.html;
    }

    location = /aroundtheus {
        return 301 /aroundtheus/;
    }

    # NewsExplorer - catch-all for everything else
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;                        
}

